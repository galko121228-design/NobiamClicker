plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nobiam.clicker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nobiam.clicker'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
}
